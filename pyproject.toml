[tool.pytest.ini_options]
testpaths = ["tests/api", "tests/connectors", "tests/consumer", "tests/control_plane", "tests/identity", "tests/temporal", "tests/tooling"]
pythonpath = ["apps/api/src", "services/control_plane/src", "scripts"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
