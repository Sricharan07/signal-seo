name: signal-integration-secrets

services:
  openbao:
    image: ghcr.io/openbao/openbao:2.6.1@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
    pull_policy: never
    entrypoint: [bao]
    command: [server, -config=/openbao/config/server.hcl]
    user: "100:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=72m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      BAO_ADDR: https://localhost:8200
      BAO_CACERT: /openbao/tls/ca.pem
    healthcheck:
      test: [CMD, bao, status, -format=json]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - type: bind
        source: ./server.hcl
        target: /openbao/config/server.hcl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tls
        target: /openbao/tls
        read_only: true
        bind:
          create_host_path: false
      - data:/openbao/file
      - audit:/openbao/logs
    networks: [secrets, application_access]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  application_access:
    external: true
    name: signal-test-secrets
  secrets:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: sig-bao
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  data:
  audit:
