services:
  database:
    image: mariadb:11.4.10@sha256:3b4dfcc32247eb07adbebec0793afae2a8eafa6860ec523ee56af4d3dec42f7f
    environment:
      MARIADB_DATABASE: signal_lab
      MARIADB_USER: signal_lab
      MARIADB_PASSWORD: ${SIGNAL_LAB_PASSWORD:?Generated by the lab runner}
      MARIADB_ROOT_PASSWORD: ${SIGNAL_LAB_ROOT_PASSWORD:?Generated by the lab runner}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [lab]
    mem_limit: 768m
    cpus: 1
    security_opt: [no-new-privileges:true]
  wordpress:
    image: wordpress:6.9.1-php8.3-apache@sha256:ffef0dca1f0fc4357bfef3856ebd1ba18f7b394378277122eaa4524ca2619d43
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: signal_lab
      WORDPRESS_DB_USER: signal_lab
      WORDPRESS_DB_PASSWORD: ${SIGNAL_LAB_PASSWORD:?Generated by the lab runner}
      SIGNAL_FEASIBILITY_LAB: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HOME', 'http://wordpress');
        define('WP_SITEURL', 'http://wordpress');
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISALLOW_FILE_MODS', true);
    volumes:
      - wordpress:/var/www/html
      - type: bind
        source: ${SIGNAL_LAB_SOURCE:?Immutable source snapshot created by the lab runner}
        target: /lab
        read_only: true
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('/var/www/html/wp-config.php') && @fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [lab]
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
networks:
  lab:
    internal: true
volumes:
  wordpress:
