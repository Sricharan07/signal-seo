name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked repository tooling
        run: npm ci --ignore-scripts
      - name: Run repository, documentation and dashboard checks
        run: npm test

  python-and-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install the document parser sandbox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap poppler-utils
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run Python lint
        run: python -m ruff check apps/api services/control_plane database/migrations deploy/crawler-network scripts tests
      - name: Verify Python formatting
        run: python -m ruff format --check apps/api services/control_plane database/migrations deploy/crawler-network scripts tests
      - name: Test API, identity, tooling and connectors
        run: python -m pytest tests/api tests/identity tests/tooling tests/connectors -q
      - name: Check the GSC provider boundary
        run: python scripts/check-gsc-provider-boundary.py
      - name: Test PostgreSQL contracts
        run: python scripts/run-database-tests.py

  labs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lab:
          - ai-answers
          - ask-signal
          - authority-journal
          - browser-worker
          - candidate-sandbox
          - consumer
          - crawler-network
          - indexnow
          - page-attempt
          - self-host
          - team-invitation
          - temporal
          - webflow
          - wordpress-draft
          - workflow-consumer-image
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked repository tooling
        run: npm ci --ignore-scripts
      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the lab
        run: python "scripts/run-${{ matrix.lab }}-tests.py"

  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lab: [openbao, keycloak]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Qualify the disposable service
        run: python "scripts/${{ matrix.lab }}_lab.py"

  autonomy-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Qualify autonomous delivery shard
        run: python scripts/run-autonomy-delivery-tests.py --shard "${{ matrix.shard }}"

  gate:
    if: always()
    needs: [repository, python-and-postgresql, labs, services, autonomy-delivery]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: python3 -c "import json, os, sys; r = json.loads(os.environ['RESULTS']); print(r); sys.exit(0 if r and all(x == 'success' for x in r) else 1)"
