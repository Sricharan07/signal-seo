name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked repository tooling
        run: npm ci --ignore-scripts
      - name: Run repository and documentation checks
        run: npm test

  python-and-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run Python lint
        run: python -m ruff check apps/api services/control_plane database/migrations deploy/crawler-network scripts tests/api tests/consumer tests/container tests/control_plane tests/crawler tests/delivery tests/identity tests/page_attempt tests/temporal tests/tooling
      - name: Verify Python formatting
        run: python -m ruff format --check apps/api services/control_plane database/migrations deploy/crawler-network scripts tests/api tests/consumer tests/container tests/control_plane tests/crawler tests/delivery tests/identity tests/page_attempt tests/temporal tests/tooling
      - name: Test API, identity protocol, and disposable tooling
        run: python -m pytest tests/api tests/identity tests/tooling -q
      - name: Qualify PKCE secrets against disposable OpenBao
        run: python scripts/openbao_lab.py
      - name: Qualify OIDC against disposable Keycloak
        run: python scripts/keycloak_lab.py
      - name: Qualify deterministic start against disposable Temporal
        run: python scripts/run-temporal-tests.py
      - name: Qualify the composed consumer across PostgreSQL and Temporal
        run: python scripts/run-consumer-tests.py
      - name: Qualify the workflow consumer OCI image
        run: python scripts/run-workflow-consumer-image-tests.py
      - name: Qualify isolated candidate builds
        run: python scripts/run-candidate-sandbox-tests.py
      - name: Qualify the crawler HTTP network boundary
        run: python scripts/run-crawler-network-tests.py
      - name: Qualify durable page attempts across PostgreSQL and the crawler network
        run: python scripts/run-page-attempt-tests.py
      - name: Test PostgreSQL contracts
        run: python scripts/run-database-tests.py
      - name: Qualify authority-restriction journal
        run: python scripts/run-authority-journal-tests.py

  autonomy-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Qualify autonomous delivery shard
        run: python scripts/run-autonomy-delivery-tests.py --shard "${{ matrix.shard }}"
